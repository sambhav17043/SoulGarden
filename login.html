<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Soul Garden</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page1">
    <section id="header">
        <a href="#"><img src="LOGO1.jpg" class="LOGO1" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="/">Home</a></li>
                <li><a href="shop">Shop</a></li>
                <li><a href="blog">Blog</a></li>
                <li><a href="about">About</a></li>
                <li><a href="contact">Contact</a></li>
                <li id="Ig-bag"><a href="cart"><i class="far fa-shopping-bag"></i></a></li>
                <a href="#" id="close"><i class="far fa-times"></i></a>
            </ul>
        </div>
        
    </section>
    <section id="formContent">
        <h2>Log in to your account</h2>
        <form action="/login" method="post" id="loginForm">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const formData = new FormData(this);
    
          fetch('/login', {
            method: 'POST',
            body: formData
          })
          .then(response => response.text())
          .then(data => {
            alert(data); // Display server response
            // Optionally redirect or update UI after successful login
          })
          .catch(error => {
            console.error('Error:', error);
            alert('Login failed. Please try again.');
          });
        });
      </script>
</body>
</html>
